when:
  - event: [push, pull_request]
    branch: main

steps:
  - name: install
    image: mcr.microsoft.com/devcontainers/php:8.4@sha256:a5661904b8611ebfa831a73c7d629e3a756a0db20fe77f67d3fc665b0caa6e09
    commands:
      - composer validate --strict
      - composer install --prefer-dist --no-progress

  - name: rector
    image: mcr.microsoft.com/devcontainers/php:8.4@sha256:a5661904b8611ebfa831a73c7d629e3a756a0db20fe77f67d3fc665b0caa6e09
    depends_on: [install]
    commands:
      - composer run-script rector:test

  - name: phpstan
    image: mcr.microsoft.com/devcontainers/php:8.4@sha256:a5661904b8611ebfa831a73c7d629e3a756a0db20fe77f67d3fc665b0caa6e09
    depends_on: [install]
    commands:
      - composer run-script phpstan
